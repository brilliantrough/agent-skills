name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 结构、语法、文档计数、敏感值与个人路径
      - name: 公开体检
        run: bash scripts/check.sh

      # 离线可跑的回归；需要真实宿主或真实产物的测试不在这里
      - name: 回归测试
        run: |
          set -e
          python3 tests/merge-private-preservation.py
          python3 tests/pi-setup-shell-messages.py
          python3 tests/nju-ppt-install.py
          node tests/pretty-tui-grouping.mjs
          node tests/ui-sidebar.mjs
          node tests/ui-copy-clean.mjs
          node tests/ui-render-dedupe.mjs
